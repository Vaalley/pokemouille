packages:
  - apps/*
  - packages/*
  - tools/*

nodeLinker: hoisted
packageImportMethod: copy
hoistWorkspacePackages: false
# Platform binaries come from optional dependencies; wrangler/workerd run without scripts.
allowBuilds:
  esbuild: false
  workerd: false

catalogMode: prefer

catalog:
  "@cloudflare/workers-types": ^5.20261110.1
  "@internationalized/date": ^3.12.4
  "@types/node": ^26.6.6
  "@types/pngjs": ^6.0.5
  bits-ui: ^2.21.0
  pngjs: ^7.0.0
  # SvelteKit 3.2 and svelte-check 4.7 require the TypeScript 6 compiler API.
  typescript: ~6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  wrangler: ^4.160.1
overrides:
  vite@*: "catalog:"
  # runed 0.38 supports the SvelteKit 3 optional peer used by this workspace.
  bits-ui@2.21.0>runed: 0.38.0
  svelte-toolbelt@0.10.7>runed: 0.38.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.6.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.6.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.6.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.6.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.6.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.6.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.6.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.6.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.6.0"
  - vite-plus@1.6.0
  - bits-ui@2.21.0
  - miniflare@5.20261110.1-beta
  - wrangler@4.160.1
