packages:
  - apps/*
  - packages/*
  - tools/*

nodeLinker: hoisted
packageImportMethod: copy
hoistWorkspacePackages: false

catalogMode: prefer

catalog:
  "@internationalized/date": ^3.12.4
  "@types/node": ^24
  bits-ui: ^2.19.5
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@sveltejs/kit@3.1.0"
