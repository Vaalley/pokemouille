<!doctype html>
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=Pixelify+Sans:wght@400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint (key: "theme" in src/lib/data/context.ts).
      // Blocked storage or any other value keeps "auto", which follows prefers-color-scheme.
      try {
        var theme = localStorage.getItem("pokemouille.theme");
        if (["light", "dark", "dark-red", "dark-blue", "dark-yellow"].includes(theme))
          document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
