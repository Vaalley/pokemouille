name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Weekly dataset refresh (Monday 03:17 UTC).
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh the dataset from PokéAPI (resumes an incomplete refresh)
        type: boolean
        default: false

# One writer for the R2 dataset, ingestion state and Worker deployment.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 19/10/2026; bump deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          # Node comes from .node-version.
          cache: true

      - name: Refresh dataset
        id: refresh
        if: github.event_name == 'schedule' || inputs.refresh
        shell: bash
        run: |
          node apps/website/scripts/r2.ts state-pull
          phase=$(node tools/data/src/cli.ts status --state-dir .data/state --out-dir apps/website/static/data | jq -r '.active.phase // "none"')
          fresh=""
          if [ "$phase" = complete ] || [ "$phase" = none ]; then fresh="--fresh"; fi
          code=0
          node tools/data/src/cli.ts refresh --state-dir .data/state --out-dir apps/website/static/data $fresh || code=$?
          # Persist cached responses and the rate ledger even when the refresh stopped early.
          node apps/website/scripts/r2.ts state-push
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) ;;
            1) echo "::warning::Dataset refresh failed; falling back to the last published dataset." ;;
            2) echo "::warning::Dataset refresh incomplete; falling back to the last published dataset. Run Deploy with refresh enabled again after the cooldown or budget window to resume." ;;
            *) exit "$code" ;;
          esac

      # Without a successful refresh in this run, build the last published snapshot.
      - name: Download published dataset
        if: steps.refresh.outputs.exit_code != '0'
        run: node apps/website/scripts/r2.ts data-pull

      # Rebuild derived assets from the last published source data, including older
      # R2 snapshots without current projections. No upstream requests or state needed.
      - name: Republish current dataset projections
        run: node tools/data/src/cli.ts republish --out-dir apps/website/static/data

      - run: vp run website#build

      # Revisions and immutable chunks first, then the manifest, then the Worker:
      # clients of either deployment always find the files they reference.
      - run: node apps/website/scripts/r2.ts sync

      - run: vp run cf:deploy

      - name: Prune superseded dataset revisions
        run: node apps/website/scripts/r2.ts prune

      - name: Verify retained dataset assets
        run: node apps/website/scripts/r2.ts verify-retention

      # Use native failed-run notifications without interrupting the last-good deployment.
      - name: Check dataset refresh health
        env:
          REFRESH_EXIT_CODE: ${{ steps.refresh.outputs.exit_code }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const refreshCode = process.env.REFRESH_EXIT_CODE;
          if (refreshCode === "1" || refreshCode === "2") {
            const status = refreshCode === "2" ? "incomplete" : "failed";
            console.error(`::error::Dataset refresh ${status}; deployed the last published dataset.`);
            process.exitCode = 1;
          }

          const manifest = JSON.parse(readFileSync("apps/website/static/data/manifest.json", "utf8"));
          const timestamp = manifest.source?.retrievalCompletedAt;
          const completedAt = typeof timestamp === "string" ? Date.parse(timestamp) : NaN;
          // Two weekly refresh intervals; offline republishing does not reset this timestamp.
          const maxAgeDays = 14;
          const now = Date.now();
          if (!Number.isFinite(completedAt) || completedAt > now) {
            console.error("::error::Invalid dataset freshness timestamp: source.retrievalCompletedAt.");
            process.exitCode = 1;
          } else if (now - completedAt > maxAgeDays * 86_400_000) {
            const message = `Deployed dataset was last retrieved ${new Date(completedAt).toISOString()} (over ${maxAgeDays} days ago).`;
            if (refreshCode) {
              console.error(`::error::${message}`);
              process.exitCode = 1;
            } else {
              console.warn(`::warning::${message}`);
            }
          }
          NODE
