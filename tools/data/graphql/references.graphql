    }
    flavorTexts: moveflavortexts(
      where: { language_id: { _in: [1, 5, 9, 11] } }
      order_by: { id: asc }
      limit: 1000
    ) {
      languageId: language_id
      versionGroupId: version_group_id
      text: flavor_text
    }
    flavorTextsCount: moveflavortexts_aggregate(where: { language_id: { _in: [1, 5, 9, 11] } }) {
      aggregate {
        count
      }
    }
  }
  movesCount: move_aggregate {
    aggregate {
      count
    }
  }
  moveEffects: moveeffect(order_by: { id: asc }, limit: 4096) {
    id
    effects: moveeffecteffecttexts(
      where: { language_id: { _in: [1, 5, 9, 11] } }
      order_by: { id: asc }
      limit: 8
    ) {
      languageId: language_id
      effect
      shortEffect: short_effect
    }
    effectsCount: moveeffecteffecttexts_aggregate(where: { language_id: { _in: [1, 5, 9, 11] } }) {
      aggregate {
        count
      }
    }
  }
  moveEffectsCount: moveeffect_aggregate {
    aggregate {
      count
    }
  }
  learnMethods: movelearnmethod(order_by: { id: asc }, limit: 128) {
    id
    identifier: name
    names: movelearnmethodnames(
      where: { language_id: { _in: [1, 5, 9, 11] } }
      order_by: { language_id: asc }
      limit: 8
    ) {
      languageId: language_id
      name
    }
    namesCount: movelearnmethodnames_aggregate(where: { language_id: { _in: [1, 5, 9, 11] } }) {
      aggregate {
        count
      }
    }
  }
  learnMethodsCount: movelearnmethod_aggregate {
    aggregate {
      count
    }
  }
  items: item(order_by: { id: asc }, limit: 4096) {
    id
    identifier: name
    names: itemnames(
      where: { language_id: { _in: [1, 5, 9, 11] } }
      order_by: { language_id: asc }
      limit: 8
    ) {
      languageId: language_id
      name
    }
    namesCount: itemnames_aggregate(where: { language_id: { _in: [1, 5, 9, 11] } }) {
      aggregate {
        count
      }
    }
    flavorTexts: itemflavortexts(
      where: { language_id: { _in: [1, 5, 9, 11] } }
      order_by: { id: asc }
      limit: 1000
    ) {
      languageId: language_id
      versionGroupId: version_group_id
      text: flavor_text
    }
    flavorTextsCount: itemflavortexts_aggregate(where: { language_id: { _in: [1, 5, 9, 11] } }) {
      aggregate {
        count
      }
    }
    effects: itemeffecttexts(
      where: { language_id: { _in: [1, 5, 9, 11] } }
      order_by: { id: asc }
      limit: 8
    ) {
      languageId: language_id
