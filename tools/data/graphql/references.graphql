      shortEffect: short_effect
    }
    effectsCount: itemeffecttexts_aggregate(where: { language_id: { _in: [1, 5, 9, 11] } }) {
      aggregate {
        count
      }
    }
  }
  itemsCount: item_aggregate {
    aggregate {
      count
    }
  }
  evolutionTriggers: evolutiontrigger(order_by: { id: asc }, limit: 128) {
    id
    identifier: name
    names: evolutiontriggernames(
      where: { language_id: { _in: [1, 5, 9, 11] } }
      order_by: { language_id: asc }
      limit: 8
    ) {
      languageId: language_id
      name
    }
    namesCount: evolutiontriggernames_aggregate(where: { language_id: { _in: [1, 5, 9, 11] } }) {
      aggregate {
        count
      }
    }
  }
  evolutionTriggersCount: evolutiontrigger_aggregate {
    aggregate {
      count
    }
  }
}
