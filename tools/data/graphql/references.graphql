    }
    statChangesCount: movemetastatchanges_aggregate {
      aggregate {
        count
      }
    }
    meta: movemeta(order_by: { id: asc }, limit: 2) {
      id
      minHits: min_hits
      maxHits: max_hits
      minTurns: min_turns
      maxTurns: max_turns
      drain
      healing
      critRate: crit_rate
      ailmentChance: ailment_chance
      flinchChance: flinch_chance
      statChance: stat_chance
      ailment: movemetaailment {
        id
        identifier: name
        names: movemetaailmentnames(
          where: { language_id: { _in: [1, 5, 9, 11] } }
          order_by: { language_id: asc }
          limit: 8
        ) {
          languageId: language_id
          name
        }
        namesCount: movemetaailmentnames_aggregate(where: { language_id: { _in: [1, 5, 9, 11] } }) {
          aggregate {
            count
          }
        }
      }
      category: movemetacategory {
        id
        identifier: name
        descriptions: movemetacategorydescriptions(
          where: { language_id: { _in: [1, 5, 9, 11] } }
          order_by: { language_id: asc }
          limit: 8
        ) {
          languageId: language_id
          description
        }
        descriptionsCount: movemetacategorydescriptions_aggregate(
          where: { language_id: { _in: [1, 5, 9, 11] } }
        ) {
          aggregate {
            count
          }
        }
      }
    }
    metaCount: movemeta_aggregate {
      aggregate {
        count
      }
    }
    names: movenames(
      where: { language_id: { _in: [1, 5, 9, 11] } }
      order_by: { language_id: asc }
      limit: 8
    ) {
      languageId: language_id
      name
    }
    namesCount: movenames_aggregate(where: { language_id: { _in: [1, 5, 9, 11] } }) {
      aggregate {
        count
      }
    }
    flavorTexts: moveflavortexts(
      where: { language_id: { _in: [1, 5, 9, 11] } }
      order_by: { id: asc }
      limit: 1000
    ) {
      languageId: language_id
      versionGroupId: version_group_id
      text: flavor_text
    }
    flavorTextsCount: moveflavortexts_aggregate(where: { language_id: { _in: [1, 5, 9, 11] } }) {
      aggregate {
        count
      }
    }
  }
  movesCount: move_aggregate {
    aggregate {
      count
    }
  }
  moveEffects: moveeffect(order_by: { id: asc }, limit: 4096) {
    id
    effects: moveeffecteffecttexts(
